name: models

# Manual: export the translation models, verify them, and publish them with manifest.json
# as assets of the GitHub release models-v<version> (the repo is public, so the app downloads
# them without a token).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Model release version (release tag models-v<version>)"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
      - name: Python env
        run: |
          uv python install 3.11
          uv venv --python 3.11 .venv
          uv pip install --python .venv torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv -r models/requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1

      - name: Export
        run: |
          .venv/bin/python -m models.export ct2 vinai-en2vi
          .venv/bin/python -m models.export ct2 opus-mt-en-vi
          .venv/bin/python -m models.export onnx opus-mt-en-vi

      - name: Verify CT2 against transformers
        run: |
          .venv/bin/python -m models.verify ct2 vinai-en2vi
          .venv/bin/python -m models.verify ct2 opus-mt-en-vi
          rm -f models/out/verify_*.json

      - name: Stage + manifest
        run: >
          .venv/bin/python -m models.manifest
          --github-release "${{ github.repository }}"
          --version "${{ inputs.version }}"
          --stage models/out/release

      - name: Publish GitHub release models-v${{ inputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="models-v${{ inputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" models/out/release/* --clobber
          else
            gh release create "$TAG" models/out/release/* --title "Models v${{ inputs.version }}"               --notes "Translation models for ScreenTrans (opus-mt-en-vi: Apache-2.0, vinai-en2vi: AGPL-3.0). See NOTICE.md."
          fi
          echo "Manifest: https://github.com/${{ github.repository }}/releases/download/$TAG/manifest.json"
