name: android-spike

on:
  workflow_dispatch:
  push:
    branches: [phase-0]
    paths:
      - "android/**"
      - "models/**"
      - ".github/workflows/android-spike.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
      - name: Python env for model export
        run: |
          uv python install 3.11
          uv venv --python 3.11 .venv
          uv pip install --python .venv torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv -r models/requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-opus-mt-en-vi-v1

      - name: Export ONNX + golden
        run: |
          .venv/bin/python -m models.export onnx opus-mt-en-vi
          .venv/bin/python -m models.onnx_ref golden

      - name: Put model into APK assets
        run: |
          A=android/app/src/main/assets/model
          mkdir -p $A
          M=models/out/opus-mt-en-vi-onnx
          cp $M/encoder_model.onnx $M/decoder_model_merged.onnx $M/config.json $M/vocab.json $M/sp_source.json $A/
          cp models/sentences_en.txt $A/sentences.txt
          cp models/out/golden_opus.json $A/
          ls -la $A

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: mt-core golden tests (real model)
        working-directory: android
        run: ./gradlew :mt-core:test -Dmt.modelDir=$GITHUB_WORKSPACE/models/out/opus-mt-en-vi-onnx -Dmt.golden=$GITHUB_WORKSPACE/models/out/golden_opus.json

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: screentrans-spike-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
