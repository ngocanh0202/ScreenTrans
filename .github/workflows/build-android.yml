name: build-android

on:
  push:
    branches: [main, "phase-*"]
    paths:
      - "android/**"
      - "shared/**"
      - "models/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + compile app
        working-directory: android
        run: |
          set +e
          ./gradlew :mt-core:test :text-core:test :app-core:test :app:compileDebugKotlin --continue 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          # Kotlin errors -> GitHub annotations (readable through the public checks API)
          grep -E '^e: file:///' build.log | sed -E 's#^e: file://.*/(android/[^:]+):([0-9]+):([0-9]+) (.*)$#::error file=\1,line=\2,col=\3::\4#' | head -50
          grep -E 'FAILED|AssertionFailedError|expected:' build.log | head -30 | sed -E 's#^(.*)$#::error ::\1#'
          # Gradle's own explanation of a failed task
          grep -A 25 'What went wrong' build.log | grep -v '^ *$' | head -60 | sed -E 's#^(.*)$#::error ::\1#'
          exit $status

  apk:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Python env for model export
        run: |
          uv python install 3.11
          uv venv --python 3.11 .venv
          uv pip install --python .venv torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv -r models/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-opus-mt-en-vi-v1
      - name: Export ONNX model into APK assets
        run: |
          .venv/bin/python -m models.export onnx opus-mt-en-vi
          .venv/bin/python -m models.onnx_ref golden
          A=android/app/src/main/assets/model
          mkdir -p $A
          M=models/out/opus-mt-en-vi-onnx
          cp $M/encoder_model.onnx $M/decoder_model_merged.onnx $M/config.json $M/vocab.json $M/sp_source.json $A/
          echo "opus-mt-en-vi-onnx-$(git log -1 --format=%h -- models)" > $A/VERSION
          ls -la $A
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Golden tests with the real model
        working-directory: android
        run: ./gradlew :mt-core:test -Dmt.modelDir=$GITHUB_WORKSPACE/models/out/opus-mt-en-vi-onnx -Dmt.golden=$GITHUB_WORKSPACE/models/out/golden_opus.json
      - name: Signing key (optional secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.keystore
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with the debug key."
          fi
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/*.apk $GITHUB_WORKSPACE/ScreenTrans-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTrans-android
          path: ScreenTrans-android.apk
          retention-days: 30
