name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    uses: ./.github/workflows/build-windows.yml

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ScreenTrans-windows
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" ScreenTrans-windows.zip \
            --repo "${{ github.repository }}" --title "ScreenTrans ${{ github.ref_name }}" \
            --notes "Windows build. Unzip and run ScreenTrans.exe; the translation model (~440 MB) downloads on first start."
