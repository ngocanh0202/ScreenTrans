name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    uses: ./.github/workflows/build-windows.yml

  build-android:
    uses: ./.github/workflows/build-android.yml
    secrets: inherit

  publish:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v tag="${{ github.ref_name }}" '$0 == "## " tag {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Windows: unzip and run ScreenTrans.exe (the model downloads on first start). Android: install ScreenTrans-android.apk (model included)." > notes.md
      - uses: actions/download-artifact@v4
        with:
          name: ScreenTrans-windows
      - uses: actions/download-artifact@v4
        with:
          name: ScreenTrans-android
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" ScreenTrans-windows.zip ScreenTrans-android.apk \
            --repo "${{ github.repository }}" --title "ScreenTrans ${{ github.ref_name }}" \
            --notes-file notes.md
