hotkeys:
  translate_region: "ctrl+alt+t"
  translate_fullscreen: "ctrl+alt+f"
  toggle_live: "ctrl+alt+l"
  edit_last: "ctrl+alt+e"     # sửa bản dịch gần nhất
ocr:
  engine: windows          # windows (rapid: deferred, too slow in Phase 0)
translator:
  model: vinai-en2vi       # vinai-en2vi | opus-mt-en-vi (theo manifest)
  model_dir: null          # thư mục model local; null = tải theo manifest
  beam_size: 2
  intra_threads: 2
overlay:
  font_size: 14
  opacity: 0.85
  show_source: false
  long_text: grow          # Live, bản dịch dài: grow = kéo dài khung | shrink = thu nhỏ chữ
live:
  interval_ms: 300
  active_interval_ms: 100
  settle_ms: 250
  max_wait_ms: 2000
  area_min_interval_ms: 1000   # Live vùng lớn: tối đa 1 OCR mỗi giây
  area_max_blocks: 30
  change_threshold: 5
  partial_interval_ms: 500     # Live: OCR khi chữ còn đang chạy, hiện từng câu ngay khi xong
cache:
  max_items: 5000
  persist: true
logging:
  save_pairs: true
  save_corrections: true      # ghi corrections.jsonl khi bạn sửa bản dịch
models:
  manifest_url: "https://github.com/ngocanh0202/ScreenTrans/releases/download/models-v1/manifest.json"
paths:
  data_dir: null           # null = %LOCALAPPDATA%\ScreenTrans
